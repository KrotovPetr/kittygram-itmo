name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select the Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_ssh_key: ${{ secrets.SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.3

      - name: Set up Yandex Cloud service account key
        working-directory: ./infra
        env:
          YC_KEY_JSON: ${{ secrets.YC_KEY_JSON }}
        run: |
          printf '%s' "$YC_KEY_JSON" > sa.json
          python3 -c "import json,sys; json.load(open('sa.json'))" \
            && echo "✅ sa.json is valid JSON" \
            || { echo "❌ sa.json is NOT valid JSON"; exit 1; }

      - name: Terraform Initialize
        working-directory: ./infra
        run: |
          terraform init \
            -reconfigure \
            -input=false \
            -backend-config="endpoint=https://storage.yandexcloud.net" \
            -backend-config="access_key=$ACCESS_KEY" \
            -backend-config="secret_key=$SECRET_KEY"
        env:
          ACCESS_KEY: ${{ secrets.YC_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.YC_SECRET_KEY }}

      - name: Terraform Import Bucket
        working-directory: ./infra
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform import yandex_storage_bucket.tf_state itmo-test
        continue-on-error: true

      - name: Terraform Plan
        working-directory: ./infra
        if: ${{ github.event.inputs.action == 'plan' }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./infra
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        working-directory: ./infra
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
